<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BraCovoit — Tableau de bord</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body id="page-dashboard">

  <!-- NAVIGATION — TODO (Dev FS6) -->

  <!-- NE PAS MODIFIER l'id — main.js y affiche l'état de connexion -->
  <div id="nav-session"></div>

  <main>
    <!-- =====================================================================
         CARTES INDICATEURS — TODO (Dev FS6)
         5 cartes chiffres clés. Layout : Grid responsive (1 colonne mobile,
         2-3 tablette, 5 desktop).

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <section class="grille-indicateurs">
      <div class="carte-indicateur vert-fonce">
      <img src="https://cdn-icons-png.flaticon.com/128/8386/8386729.png">
      <p class="label text">Trajets disponibles</p><p id="d-trajets " class="valeur"></p></div>
      <div class="carte-indicateur orange">
        <img src="https://cdn-icons-png.flaticon.com/128/12266/12266251.png">
      <p class="label text">Conducteurs actifs</p><p id="d-conducteurs" class="valeur"></p></div>
      <div class="carte-indicateur bleu">
        <img src="https://cdn-icons-png.flaticon.com/128/18018/18018681.png">
        <p class="label text">Réservations actives</p><p id="d-reservations" class="valeur"></p></div>
      <div class="carte-indicateur vert">
        <img src="https://cdn-icons-png.flaticon.com/128/8560/8560955.png">
        <p class="label text">Note moyenne</p><p id="d-note" class="valeur"></p></div>
      <div class="carte-indicateur rouge"><p class="label text">
        <img src="https://cdn-icons-png.flaticon.com/128/8695/8695043.png">

        <p>Taux d'annulation</p><p id="d-taux-annulation" class="valeur"></p></div>
    </section>

    <!-- =====================================================================
         TOP CONDUCTEURS — TODO (Dev FS6)
         main.js remplit cette liste ordonnée avec des <li> contenant un
         rang, un nom, une note et un nombre de trajets. Stylez comme un
         podium ou un classement numéroté.

         *** NE PAS MODIFIER l'id ***
         ===================================================================== -->
    
    <div class="cartes">
      <section class="top-conducteur">
      <h2 class="h3">Top 3 conducteurs</h2>
      <div  class="carte liste-conducteur">
      <ol id="d-top-conducteurs">
        <li><img src="https://ui-avatars.com/api/?name=Paul+Koumba&background=random" alt="Avatar utilisateur"></li>
      </ol>
      </div>
    </section>

    <!-- TRAJET VEDETTE — TODO (Dev FS6) : mettre en avant visuellement
         ce trajet (encart distinctif).
         *** NE PAS MODIFIER l'id *** -->
    <section class="trajet-vedette" >
      <h2 class="h3">Trajet vedette</h2>
      <div class="carte trajet-top">
      <div class="brouillard">
           <p id="d-trajet-top">
                <img src="https://picsum.photos/200/100" alt="Trajet aléatoire">
                </p>
      </div>
   
      </div>
    </section>

</div>
    <!-- =====================================================================
         TABLEAU PAR QUARTIER — TODO (Dev FS6)
         Mettre en forme le tableau (bordures, alternance de lignes,
         responsive : passage en cartes empilées sous 600px si besoin).

         *** NE PAS MODIFIER l'id ***
         ===================================================================== -->
    <section class="repartition ">
      <h2 class="h2">Répartition par quartier de départ</h2>
      <div class="carte-empile">
      <table>
        <thead class="text"><tr><th>Quartier</th><th>Nombre de trajets</th><th>Prix moyen</th></tr></thead>
        <tbody id="d-trajets-par-quartier">
       
        </tbody>
      </table>
      </div>
    </section>
  </main>
  <div id="erreur-globale"  class="badge-rouge" hidden ></div>

  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>

  <div id="erreur-globale" hidden></div>
