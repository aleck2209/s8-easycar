<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Mes trajets</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 2rem auto; padding: 1rem; }
    .ok { color: green; }
    .ko { color: red; }
    pre { background: #f5f5f5; padding: 1rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Tests rapides — Mes trajets</h1>
  <div id="resultats"></div>

  <script src="../functions.js"></script>
  <script>
    const resultats = document.getElementById("resultats");

    function afficherTest(nom, attendu, obtenu) {
      const div = document.createElement("div");
      const ok = JSON.stringify(attendu) === JSON.stringify(obtenu);
      div.className = ok ? "ok" : "ko";
      div.textContent = `${ok ? "✓" : "✗"} ${nom} → attendu: ${JSON.stringify(attendu)} | obtenu: ${JSON.stringify(obtenu)}`;
      resultats.appendChild(div);
    }

    const reservations = [
      { statut: "effectue", trajet: { prix_place: 500 } },
      { statut: "annule", trajet: { prix_place: 1000 } },
      { statut: "en_attente", trajet: { prix_place: 700 } }
    ];

    const filtre = filtrerReservationsParStatut(reservations, "effectue");
    const total = calculerTotalDepenseParPassager(reservations);

    afficherTest("Filtre effectue", 1, filtre.length);
    afficherTest("Total dépensé", 1200, total);

    const bloc = document.createElement("pre");
    bloc.textContent = `Réservations filtrées : ${JSON.stringify(filtre, null, 2)}\n\nTotal : ${total}`;
    resultats.appendChild(bloc);
  </script>
</body>
</html>
